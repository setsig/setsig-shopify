# Learn more about configuring your Shopify app at https://shopify.dev/docs/apps/tools/cli/configuration
# All host URLs are injected dynamically via environment variables during `shopify app deploy`.

name = "setsig-physical-checkin"
client_id = "${SHOPIFY_CLIENT_ID}"
application_url = "${SHOPIFY_APP_URL}"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
scopes = "read_orders,write_orders,read_products,read_locations"

[auth]
redirect_urls = [
  "${SHOPIFY_APP_URL}/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["orders/paid", "orders/create"]
  uri = "${SHOPIFY_APP_URL}/webhooks/shopify/orders"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "${SHOPIFY_APP_URL}/webhooks/shopify/gdpr"

[pos]
embedded = true
